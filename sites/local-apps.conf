server {
    listen 80;
    server_name wizzgeeks.com;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name audioanalysis.wizzgeeks.com;

    location / {
        proxy_pass http://bolt-frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://bolt-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}

server {
    listen 80;
    server_name bigfm.wizzgeeks.com;

    location / {
        proxy_pass http://bigfm-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://bigfm-backend:5001/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name dps.wizzgeeks.com;

    location / {
        proxy_pass http://dpsfrontend:3001;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_dpsbackend dpsbackend;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_dpsbackend:7202; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name qadps.wizzgeeks.com;

    location / {
        proxy_pass http://qadpsfrontend:3002;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_qadpsbackend qadpsbackend;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_qadpsbackend:7203; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}


server {
    listen 80;
    server_name admin.wizzgeeks.com;

    location / {
        proxy_pass http://strapi-app:1337/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass_request_headers on;
    }

}

server {
    listen 80;
    server_name edtechapi.desuntechnologies.com;

    location / {
        proxy_pass http://edluminauserbackend:7205; 
        proxy_http_version 1.1;
