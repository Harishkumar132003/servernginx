# edlumnis server 
server {
    listen 80;
    server_name aikalavya.com www.aikalavya.com;
    return 301 https://aikalavya.com$request_uri;
}

server {
    listen 443 ssl;
    server_name aikalavya.com www.aikalavya.com;

    ssl_certificate /etc/letsencrypt/live/aikalavya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aikalavya.com/privkey.pem;

    location / {
        proxy_pass http://newedluminauserfrontend:8104;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://newedluminauserbackend:8202/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
