server {
    listen 80;
    server_name wizzgeeks.com;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name bigfm.wizzgeeks.com;

    location / {
        proxy_pass http://bigfm-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://bigfm-backend:5001/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name qadps.wizzgeeks.com;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://d-p-s.s3.ap-south-1.amazonaws.com; media-src 'self' blob: https://d-p-s.s3.ap-south-1.amazonaws.com; font-src 'self' data:; connect-src 'self' https://api-dps.wizzgeeks.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 20M;
    location / {
        proxy_pass http://dpsfrontend:3001;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # location /api/ {
    #     resolver 127.0.0.11 valid=30s;
    #     set $upstream_dpsbackend dpsbackend;
    #     rewrite ^/api/(.*) /$1 break;
    #     proxy_pass http://$upstream_dpsbackend:7202; 
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

server {
    listen 80;
    server_name api-dps.wizzgeeks.com;
    client_max_body_size 20M;


    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_dpsbackend dpsbackend;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_dpsbackend:7202; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name report.wizzgeeks.com;

    location / {
        proxy_pass http://intellect-frontend:3003;
        proxy_set_header Host $host;
