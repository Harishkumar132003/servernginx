version: "3.8"

services:
  nginx_ssl:
    image: nginx:latest
    container_name: edlumina-nginx-ssl-443
    ports:
      - "443:443"
    volumes:
      - ./sites:/etc/nginx/conf.d:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-app-network

networks:
  shared-app-network:
    external: true
