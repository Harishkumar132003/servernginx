version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: edlumina-niginx-ssl-443
    ports:
      - "443:443"
    volumes:
      - ./sites/aikalavya-ssl-only.conf
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-443:/etc/letsencrypt:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-app-network

networks:
  shared-app-network:
    external: true
